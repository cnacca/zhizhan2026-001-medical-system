server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ai-order-platform
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ai_order_platform}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:ai_order}
    password: ${MYSQL_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
  auth:
    token-secret: ${APP_AUTH_TOKEN_SECRET:local-dev-change-me-auth-secret}
    token-ttl-seconds: ${APP_AUTH_TOKEN_TTL_SECONDS:7200}
    refresh-token-ttl-seconds: ${APP_AUTH_REFRESH_TOKEN_TTL_SECONDS:2592000}
    allow-bootstrap-headers: ${APP_AUTH_ALLOW_BOOTSTRAP_HEADERS:true}
  file:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:change-me-minio}
    bucket: ${MINIO_BUCKET:ai-order-private}
    upload-url-ttl-seconds: ${FILE_UPLOAD_URL_TTL_SECONDS:900}
    preview-url-ttl-seconds: ${FILE_PREVIEW_URL_TTL_SECONDS:900}
    download-url-ttl-seconds: ${FILE_DOWNLOAD_URL_TTL_SECONDS:7200}
    max-file-size-bytes: ${FILE_MAX_FILE_SIZE_BYTES:209715200}
  notification:
    instance-id: ${APP_INSTANCE_ID:${random.uuid}}
    redis-broadcast-enabled: ${NOTIFICATION_REDIS_BROADCAST_ENABLED:false}
    redis-channel: ${NOTIFICATION_REDIS_CHANNEL:ai-order:notifications}
  ai:
    provider: ${AI_PROVIDER:deterministic}
    max-requests-per-user-hour: ${AI_MAX_REQUESTS_PER_USER_HOUR:120}
    deepseek:
      enabled: ${AI_DEEPSEEK_ENABLED:false}
      base-url: ${AI_DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${AI_DEEPSEEK_MODEL:deepseek-chat}
      temperature: ${AI_DEEPSEEK_TEMPERATURE:0.2}
      max-tokens: ${AI_DEEPSEEK_MAX_TOKENS:800}
      connect-timeout-seconds: ${AI_DEEPSEEK_CONNECT_TIMEOUT_SECONDS:10}
      read-timeout-seconds: ${AI_DEEPSEEK_READ_TIMEOUT_SECONDS:45}
