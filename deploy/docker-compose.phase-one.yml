services:
  mysql:
    image: mysql:8.4
    container_name: ai-order-phase-one-mysql
    command: ["--default-time-zone=+08:00"]
    # 业务时区必须固定：mysql / eclipse-temurin 官方镜像默认都是 UTC，
    # 而工厂在中国，「今天」按 Asia/Shanghai 算。两者不一致会让「今日」指标和交期
    # 在上海时间 00:00-08:00 之间错一天（详见 common/BusinessTime.java）。
    # TZ 与 --default-time-zone 必须表示同一时区，改一个就要改另一个。
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ${MYSQL_DATABASE:?inject MYSQL_DATABASE externally}
      MYSQL_USER: ${MYSQL_USER:?inject MYSQL_USER externally}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?inject MYSQL_PASSWORD externally}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?inject MYSQL_ROOT_PASSWORD externally}
    volumes:
      - phase-one-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: ai-order-phase-one-redis
    volumes:
      - phase-one-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ai-order-phase-one-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?inject MINIO_ROOT_USER externally}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?inject MINIO_ROOT_PASSWORD externally}
    ports:
      - "${MINIO_PUBLIC_PORT:-9000}:9000"
    volumes:
      - phase-one-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ai-order-platform-backend:phase-one
    container_name: ai-order-backend
    build:
      context: ..
      dockerfile: backend/platform-server/Dockerfile
    environment:
      # 与 mysql 的 --default-time-zone 保持同一时区，见 common/BusinessTime.java
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:?inject frontend origin externally}
      APP_AUTH_TOKEN_SECRET: ${APP_AUTH_TOKEN_SECRET:?inject APP_AUTH_TOKEN_SECRET externally}
      APP_AUTH_TOKEN_TTL_SECONDS: ${APP_AUTH_TOKEN_TTL_SECONDS:-7200}
      APP_AUTH_REFRESH_TOKEN_TTL_SECONDS: ${APP_AUTH_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      APP_AUTH_ALLOW_BOOTSTRAP_HEADERS: "false"
      APP_AUTH_ALLOW_ROLE_FALLBACK: "false"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:?inject MYSQL_DATABASE externally}
      MYSQL_USER: ${MYSQL_USER:?inject MYSQL_USER externally}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?inject MYSQL_PASSWORD externally}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_INSTANCE_ID: ${APP_INSTANCE_ID:-ai-order-production-1}
      NOTIFICATION_REDIS_BROADCAST_ENABLED: ${NOTIFICATION_REDIS_BROADCAST_ENABLED:-false}
      NOTIFICATION_REDIS_CHANNEL: ${NOTIFICATION_REDIS_CHANNEL:-ai-order:notifications}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_INTERNAL_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?inject browser-reachable MinIO endpoint externally}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?inject MINIO_ROOT_USER externally}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?inject MINIO_ROOT_PASSWORD externally}
      MINIO_BUCKET: ${MINIO_BUCKET:?inject production bucket name externally}
      FILE_UPLOAD_URL_TTL_SECONDS: ${FILE_UPLOAD_URL_TTL_SECONDS:-900}
      FILE_PREVIEW_URL_TTL_SECONDS: ${FILE_PREVIEW_URL_TTL_SECONDS:-900}
      FILE_DOWNLOAD_URL_TTL_SECONDS: ${FILE_DOWNLOAD_URL_TTL_SECONDS:-7200}
      FILE_MAX_FILE_SIZE_BYTES: ${FILE_MAX_FILE_SIZE_BYTES:-524288000}
      FILE_ALLOWED_CONTENT_TYPES: ${FILE_ALLOWED_CONTENT_TYPES:-application/pdf,model/stl,application/sla,application/octet-stream,text/plain,image/png,image/jpeg,image/webp,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/zip,application/x-zip-compressed}
      FILE_MAX_FILES_PER_ORDER: ${FILE_MAX_FILES_PER_ORDER:-30}
      WORKFLOW_STANDARD_TIME_FORMAL_ENABLED: ${WORKFLOW_STANDARD_TIME_FORMAL_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-deterministic}
      AI_MAX_REQUESTS_PER_USER_HOUR: ${AI_MAX_REQUESTS_PER_USER_HOUR:-120}
      AI_MODEL_MAX_RETRIES: ${AI_MODEL_MAX_RETRIES:-1}
      AI_INPUT_TOKEN_COST_MICROUSD: ${AI_INPUT_TOKEN_COST_MICROUSD:-0}
      AI_OUTPUT_TOKEN_COST_MICROUSD: ${AI_OUTPUT_TOKEN_COST_MICROUSD:-0}
      AI_DAILY_BUDGET_MICROUSD: ${AI_DAILY_BUDGET_MICROUSD:-0}
      AI_ADMIN_DAILY_BUDGET_MICROUSD: ${AI_ADMIN_DAILY_BUDGET_MICROUSD:-0}
      AI_CS_DAILY_BUDGET_MICROUSD: ${AI_CS_DAILY_BUDGET_MICROUSD:-0}
      AI_DOCTOR_DAILY_BUDGET_MICROUSD: ${AI_DOCTOR_DAILY_BUDGET_MICROUSD:-0}
      AI_WORKER_DAILY_BUDGET_MICROUSD: ${AI_WORKER_DAILY_BUDGET_MICROUSD:-0}
      AI_BUDGET_NOTIFICATION_ENABLED: ${AI_BUDGET_NOTIFICATION_ENABLED:-true}
      AI_BUDGET_CIRCUIT_BREAKER_ENABLED: ${AI_BUDGET_CIRCUIT_BREAKER_ENABLED:-false}
      AI_DEEPSEEK_ENABLED: ${AI_DEEPSEEK_ENABLED:-false}
      AI_DEEPSEEK_BASE_URL: ${AI_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      AI_DEEPSEEK_MODEL: ${AI_DEEPSEEK_MODEL:-deepseek-chat}
      AI_DEEPSEEK_DAILY_BUDGET_MICROUSD: ${AI_DEEPSEEK_DAILY_BUDGET_MICROUSD:-0}
      AI_DEEPSEEK_TEMPERATURE: ${AI_DEEPSEEK_TEMPERATURE:-0.2}
      AI_DEEPSEEK_MAX_TOKENS: ${AI_DEEPSEEK_MAX_TOKENS:-800}
      AI_DEEPSEEK_CONNECT_TIMEOUT_SECONDS: ${AI_DEEPSEEK_CONNECT_TIMEOUT_SECONDS:-10}
      AI_DEEPSEEK_READ_TIMEOUT_SECONDS: ${AI_DEEPSEEK_READ_TIMEOUT_SECONDS:-45}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AI_LANGCHAIN_ENABLED: ${AI_LANGCHAIN_ENABLED:-false}
      AI_LANGCHAIN_PROVIDER: ${AI_LANGCHAIN_PROVIDER:-deepseek}
      AI_EXTERNAL_ALERT_WEBHOOK_ENABLED: ${AI_EXTERNAL_ALERT_WEBHOOK_ENABLED:-false}
      AI_EXTERNAL_ALERT_WEBHOOK_URL: ${AI_EXTERNAL_ALERT_WEBHOOK_URL:-}
      AI_EXTERNAL_ALERT_WEBHOOK_CONNECT_TIMEOUT_SECONDS: ${AI_EXTERNAL_ALERT_WEBHOOK_CONNECT_TIMEOUT_SECONDS:-5}
      AI_EXTERNAL_ALERT_WEBHOOK_READ_TIMEOUT_SECONDS: ${AI_EXTERNAL_ALERT_WEBHOOK_READ_TIMEOUT_SECONDS:-10}
      AI_EXTERNAL_ALERT_SCHEDULER_ENABLED: ${AI_EXTERNAL_ALERT_SCHEDULER_ENABLED:-false}
      AI_EXTERNAL_ALERT_SCHEDULER_BATCH_SIZE: ${AI_EXTERNAL_ALERT_SCHEDULER_BATCH_SIZE:-50}
      AI_EXTERNAL_ALERT_SCHEDULER_FIXED_DELAY_MILLIS: ${AI_EXTERNAL_ALERT_SCHEDULER_FIXED_DELAY_MILLIS:-60000}
      AI_EXTERNAL_ALERT_SCHEDULER_INITIAL_DELAY_MILLIS: ${AI_EXTERNAL_ALERT_SCHEDULER_INITIAL_DELAY_MILLIS:-60000}
      AI_EXTERNAL_ALERT_MAX_ATTEMPTS: ${AI_EXTERNAL_ALERT_MAX_ATTEMPTS:-3}
      AI_EXTERNAL_ALERT_WEBHOOK_SIGNING_ENABLED: ${AI_EXTERNAL_ALERT_WEBHOOK_SIGNING_ENABLED:-false}
      AI_EXTERNAL_ALERT_WEBHOOK_SIGNING_SECRET: ${AI_EXTERNAL_ALERT_WEBHOOK_SIGNING_SECRET:-}
      AI_EXTERNAL_ALERT_RECEIVER_VERIFICATION_ENABLED: ${AI_EXTERNAL_ALERT_RECEIVER_VERIFICATION_ENABLED:-false}
      AI_EXTERNAL_ALERT_RECEIVER_SIGNING_SECRET: ${AI_EXTERNAL_ALERT_RECEIVER_SIGNING_SECRET:-}
      AI_EXTERNAL_ALERT_RECEIVER_REPLAY_WINDOW_SECONDS: ${AI_EXTERNAL_ALERT_RECEIVER_REPLAY_WINDOW_SECONDS:-300}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    image: ai-order-platform-frontend:phase-one
    container_name: ai-order-frontend
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_HTTP_PORT:-8088}:80"
    depends_on:
      - backend

volumes:
  phase-one-mysql-data:
  phase-one-redis-data:
  phase-one-minio-data:
