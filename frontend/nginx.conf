server {
  listen 80;
  server_name www.chinesedigitaldental.com 43.129.232.106;

  return 308 https://chinesedigitaldental.com$request_uri;
}

server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 500m;

  root /usr/share/nginx/html;
  index index.html;

  # WebSocket 要额外的 Upgrade 头，且必须用 ^~ 抢在下面的正则之前匹配。
  location ^~ /ws/ {
    proxy_pass http://backend:8080/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 后端 API 前缀。这份清单必须与 frontend/vite.config.ts 的 server.proxy 一致，
  # 由 npm run check:deployment-env 静态守住——两边漂掉不会报错，只会让页面
  # 拿到 index.html 再去 JSON.parse，表现为「开发环境好好的，部署上去就空白」。
  location ~ ^/(accounts|admin|ai|api|catalog|check-records|clinics|dashboards|design-tasks|doctor|exports|files|final-inspection-reports|form-configs|logistics|messages|notifications|order-case-groups|ordering-rules|orders|orthodontic-plan-versions|patients|performance|process-instance|production|products|quality-records|rbac|reworks|staff|tasks|work-logs|workflow-chains)(/|$) {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
