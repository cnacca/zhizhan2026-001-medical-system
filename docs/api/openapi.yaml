openapi: 3.0.3
info:
  title: AI 智能下单与生产协同平台 API
  version: 1.0.0
  description: |
    牙科定制工厂三端系统（医生端 / 客服端 / 生产端 / 管理端）后端 API 规范。

    ## 认证方式
    所有接口（除登录外）必须携带 Authorization: Bearer {access_token}。
    服务端对每个接口强制校验角色权限，禁止仅靠前端隐藏。

    ## 角色枚举
    - DOCTOR：医生
    - CS：客服
    - WORKER：技工/生产人员
    - ADMIN：超级管理员

    ## 通用响应格式
    所有接口统一返回：
    { "code": 200, "msg": "success", "data": {} }
    错误时：
    { "code": 4xx/5xx, "msg": "错误说明", "data": null }
  license:
    name: Proprietary internal API
    url: https://yourdomain.com/legal/proprietary-api-license
servers:
- url: https://api.yourdomain.com/v1
  description: 正式环境
- url: https://test-api.yourdomain.com/v1
  description: 测试环境
tags:
- name: Auth
  description: 认证与 Token 管理
- name: User
  description: 用户与账号管理
- name: Clinic
  description: 诊所与客户档案
- name: Order
  description: 订单核心流程
- name: OrderForm
  description: 动态表单配置
- name: File
  description: 文件上传与预览
- name: WorkflowChain
  description: 工序链查询（预定义，只读）
- name: ProcessInstance
  description: 订单工序链实例
- name: CheckRecord
  description: 入检 / 出检记录
- name: WorkLog
  description: 工时记录
- name: Performance
  description: 绩效统计
- name: Message
  description: 消息与留言系统
- name: DesignDraft
  description: 设计稿模块
- name: Bill
  description: 账单与物流
- name: CustomerPreference
  description: 客户偏好
- name: AI
  description: AI 智能体接口
- name: Notification
  description: 通知 REST 与 WebSocket 事件定义
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CommonResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
          example: success
        data: {}
    LoginRequest:
      type: object
      required:
      - username
      - password
      - portal
      properties:
        username:
          type: string
          example: doctor001
        password:
          type: string
          example: "******"
        portal:
          type: string
          description: 登录入口；服务端会校验账号角色是否匹配所选入口。
          enum:
          - DOCTOR
          - CS
          - PRODUCTION
          - ADMIN
          example: DOCTOR
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: 服务端签发的 Bearer token
        refreshToken:
          type: string
          description: 服务端签发的刷新令牌；客户端仅提交给 refresh/logout，不作为 Bearer token 使用
        username:
          type: string
        userId:
          type: integer
          format: int64
          nullable: true
        clinicId:
          type: integer
          format: int64
          nullable: true
        roles:
          type: array
          items:
            type: string
            enum:
            - DOCTOR
            - CS
            - WORKER
            - ADMIN
        permissions:
          type: array
          items:
            type: string
          description: 当前账号角色聚合后的权限码
        menus:
          type: array
          items:
            "$ref": "#/components/schemas/AuthMenu"
          description: 当前账号可见菜单，用于前端权限路由
        dataScope:
          type: string
          nullable: true
          enum:
          - ALL
          - CLINIC
          - SELF
          - NONE
          description: 当前账号的数据范围
        expiresAt:
          type: string
          format: date-time
        refreshExpiresAt:
          type: string
          format: date-time
    RefreshTokenRequest:
      type: object
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
          description: 登录或刷新时返回的 refreshToken
    CurrentUserResponse:
      type: object
      properties:
        username:
          type: string
        userId:
          type: integer
          format: int64
          nullable: true
        clinicId:
          type: integer
          format: int64
          nullable: true
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        menus:
          type: array
          items:
            "$ref": "#/components/schemas/AuthMenu"
        dataScope:
          type: string
          nullable: true
    AuthMenu:
      type: object
      properties:
        menuCode:
          type: string
          example: internal-orders
        menuName:
          type: string
          example: 内部订单
        menuType:
          type: string
          example: MENU
        routePath:
          type: string
          nullable: true
          example: /orders/internal
        componentPath:
          type: string
          nullable: true
          example: InternalOrdersView
        permissionCode:
          type: string
          nullable: true
          example: order:read-internal
        icon:
          type: string
          nullable: true
        sortOrder:
          type: integer
          nullable: true
    OrderStatus:
      type: string
      enum:
      - PENDING_REVIEW
      - DESIGNING
      - PRODUCING
      - QC
      - PENDING_SHIP
      - SHIPPED
      - COMPLETED
      description: |
        外部状态枚举（医生端可见）：
        PENDING_REVIEW=待审核, DESIGNING=设计中, PRODUCING=生产中,
        QC=质检中, PENDING_SHIP=待发货, SHIPPED=已发货, COMPLETED=已完成
    OrderBrief:
      type: object
      properties:
        order_id:
          type: integer
        order_no:
          type: string
        product_type:
          type: string
        external_status:
          "$ref": "#/components/schemas/OrderStatus"
        create_time:
          type: string
          format: date-time
        clinic_name:
          type: string
    DoctorOrderSummary:
      type: object
      description: 医生端订单列表/详情脱敏视图，不包含 internal_status、production_note、cs_user_id。
      properties:
        order_id:
          type: integer
        order_no:
          type: string
        product_type:
          type: string
        external_status:
          "$ref": "#/components/schemas/OrderStatus"
        form_data:
          type: object
        public_message:
          type: string
          nullable: true
        bill_status:
          type: string
          nullable: true
        logistics_status:
          type: string
          nullable: true
        tracking_no:
          type: string
          nullable: true
    OrderListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            oneOf:
            - "$ref": "#/components/schemas/DoctorOrderSummary"
            - "$ref": "#/components/schemas/OrderDetail"
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
    FormFieldConfig:
      type: object
      properties:
        field_id:
          type: integer
        product_type:
          type: string
        field_key:
          type: string
        field_label:
          type: string
        field_type:
          type: string
          enum:
          - text
          - textarea
          - select
          - multi-select
          - number
          - date
          - file
        is_required:
          type: boolean
        options:
          type: array
          items:
            type: string
        sort_order:
          type: integer
    CreateOrderRequest:
      type: object
      required:
      - product_type
      - form_data
      properties:
        product_type:
          type: string
          example: REGULAR_CROWN
        form_data:
          type: object
          description: 动态表单填写内容，key 为 field_key，value 为填写值。
          example:
            patient_name: 张三
            tooth_position: '11,21'
            material: 氧化锆
        file_ids:
          type: array
          items:
            type: integer
          description: 已完成且医生本人可绑定的 file_id 列表。
        is_draft:
          type: boolean
          default: false
          description: 9D.2 第一增量暂不支持草稿；传 true 会返回 400。
    CreateOrderResponse:
      type: object
      description: 医生提交订单后的脱敏响应，不包含 internal_status。
      properties:
        order_id:
          type: integer
        order_no:
          type: string
        product_type:
          type: string
        external_status:
          "$ref": "#/components/schemas/OrderStatus"
        form_data:
          type: object
    OrderReviewRequest:
      type: object
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - APPROVE
          - REJECT
        reject_reason:
          type: string
          description: action=REJECT 时必填；写入 orders.reject_reason，并通过通知提示医生补资料。
        production_note:
          type: string
          description: action=APPROVE 时可填；写入内部生产备注。本接口只进入生产审核状态，不实例化工序。
    OrderDetail:
      allOf:
      - "$ref": "#/components/schemas/OrderBrief"
      - type: object
        properties:
          form_data:
            type: object
            description: 动态表单填写内容，key 为 field_key
          attachments:
            type: array
            items:
              "$ref": "#/components/schemas/FileInfo"
          reject_reason:
            type: string
          production_note:
            type: string
            description: 仅内部角色可见
          internal_status:
            type: string
            description: 仅内部角色可见
          cs_user_id:
            type: integer
            description: 仅内部角色可见
    FileInfo:
      type: object
      properties:
        file_id:
          type: integer
        file_name:
          type: string
        file_size:
          type: integer
          description: 字节
        file_type:
          type: string
          example: image/jpeg
        preview_url:
          type: string
          description: 15 分钟签名预览 URL
    MessageStatus:
      type: string
      enum:
      - DIRECT
      - PENDING_REVIEW
      - APPROVED
      - REJECTED
    MessageItem:
      type: object
      properties:
        msg_id:
          type: integer
        order_id:
          type: integer
        sender_user_id:
          type: integer
        sender_role:
          type: string
          enum:
          - DOCTOR
          - CS
          - WORKER
        sender_name:
          type: string
        content:
          type: string
        edited_content:
          type: string
          description: 客服编辑后内容
        attachment_urls:
          type: array
          items:
            type: string
        visible_to:
          type: string
        review_status:
          "$ref": "#/components/schemas/MessageStatus"
        review_note:
          type: string
        create_time:
          type: string
          format: date-time
    DraftStatus:
      type: string
      enum:
      - PENDING_CS_REVIEW
      - CS_REJECTED
      - PENDING_DOCTOR_CONFIRM
      - DOCTOR_CONFIRMED
      - DOCTOR_REJECTED
    PerformanceStats:
      type: object
      properties:
        user_id:
          type: integer
        username:
          type: string
        completed_count:
          type: integer
          description: 完成工序数
        effective_duration:
          type: integer
          description: 有效工时（分钟）
        rework_count:
          type: integer
          description: 返工次数
        on_time_rate:
          type: number
          description: 准时率（0-1）
        pass_rate:
          type: number
          description: 一次通过率（0-1）
        duration_efficiency:
          type: number
          description: 工时效率（标准工时÷实际工时×100%）
    ErrorResponse:
      type: object
      required:
      - code
      - msg
      - data
      properties:
        code:
          type: integer
          example: 403
        msg:
          type: string
          example: forbidden
        data:
          nullable: true
          type: object
    UploadTokenRequest:
      type: object
      required:
      - order_id
      - source_type
      - visibility
      - original_filename
      - content_type
      - file_size
      properties:
        order_id:
          type: integer
        source_type:
          type: string
          example: ORDER_ATTACHMENT
        visibility:
          type: string
          enum:
          - DOCTOR
          - DOCTOR_CS
          - INTERNAL
          - ALL
        original_filename:
          type: string
          example: scan.stl
        content_type:
          type: string
          example: model/stl
        file_size:
          type: integer
          format: int64
    UploadTokenResponse:
      type: object
      properties:
        file_id:
          type: integer
        upload_url:
          type: string
        expires_in_seconds:
          type: integer
          example: 900
    MultipartInitiateRequest:
      type: object
      required:
      - order_id
      - source_type
      - visibility
      - original_filename
      - content_type
      - file_size
      properties:
        order_id:
          type: integer
        source_type:
          type: string
          example: ORDER_ATTACHMENT
        visibility:
          type: string
          enum:
          - DOCTOR
          - DOCTOR_CS
          - INTERNAL
          - ALL
        original_filename:
          type: string
          example: scan.stl
        content_type:
          type: string
          example: model/stl
        file_size:
          type: integer
          format: int64
        part_size:
          type: integer
          format: int64
          nullable: true
          example: 5242880
    MultipartInitiateResponse:
      type: object
      properties:
        file_id:
          type: integer
        upload_id:
          type: string
        part_size:
          type: integer
          format: int64
        part_count:
          type: integer
        expires_in_seconds:
          type: integer
          example: 900
    MultipartPartUrlRequest:
      type: object
      required:
      - upload_id
      - part_number
      properties:
        upload_id:
          type: string
        part_number:
          type: integer
          minimum: 1
    MultipartPartUrlResponse:
      type: object
      properties:
        file_id:
          type: integer
        upload_id:
          type: string
        part_number:
          type: integer
        upload_url:
          type: string
        expires_in_seconds:
          type: integer
          example: 900
    MultipartStatusResponse:
      type: object
      properties:
        file_id:
          type: integer
        upload_id:
          type: string
        upload_status:
          type: string
          enum:
          - PENDING
        part_size:
          type: integer
          format: int64
        part_count:
          type: integer
        completed_parts:
          type: array
          items:
            type: object
            properties:
              part_number:
                type: integer
              etag:
                type: string
              size:
                type: integer
                format: int64
    MultipartPendingUpload:
      type: object
      properties:
        file_id:
          type: integer
        upload_id:
          type: string
        order_id:
          type: integer
        source_type:
          type: string
        visibility:
          type: string
        original_filename:
          type: string
        content_type:
          type: string
          nullable: true
        file_size:
          type: integer
          format: int64
        part_size:
          type: integer
          format: int64
        part_count:
          type: integer
    MultipartPendingUploadsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/MultipartPendingUpload"
    MultipartCompleteRequest:
      type: object
      required:
      - upload_id
      - parts
      properties:
        upload_id:
          type: string
        parts:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - part_number
            - etag
            properties:
              part_number:
                type: integer
                minimum: 1
              etag:
                type: string
    MultipartAbortRequest:
      type: object
      required:
      - upload_id
      properties:
        upload_id:
          type: string
    FileCompleteResponse:
      type: object
      properties:
        file_id:
          type: integer
        upload_status:
          type: string
          example: COMPLETED
        file_size:
          type: integer
          format: int64
        content_type:
          type: string
        checksum:
          type: string
    FileSignedUrlResponse:
      type: object
      properties:
        file_id:
          type: integer
        preview_url:
          type: string
          nullable: true
        download_url:
          type: string
          nullable: true
        expires_in_seconds:
          type: integer
    ProductionReviewRequest:
      type: object
      description: 生产审核请求；仅允许处理 internal_status=PENDING_PRODUCTION_REVIEW 的订单。
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - APPROVE
          - REJECT
        chain_id:
          type: integer
          description: action=APPROVE 时必填
        intake_branch:
          type: string
          enum:
          - IMPRESSION
          - SCAN
        branch_params:
          type: object
          description: 贴面、种植基台等内部路线参数
        reject_reason:
          type: string
    ProductionReviewResponse:
      type: object
      properties:
        order_id:
          type: integer
        instance_id:
          type: integer
          nullable: true
        internal_status:
          type: string
        external_status:
          "$ref": "#/components/schemas/OrderStatus"
    ProcessNodeInstance:
      type: object
      properties:
        node_instance_id:
          type: integer
        node_code:
          type: string
        process_name:
          type: string
        step_order:
          type: integer
        is_optional:
          type: integer
          enum:
          - 0
          - 1
        branch_group:
          type: string
          nullable: true
        assigned_user_id:
          type: integer
          nullable: true
        node_status:
          type: string
          enum:
          - PENDING
          - READY
          - IN_PROGRESS
          - COMPLETED
          - SKIPPED
        standard_duration:
          type: integer
          nullable: true
    ProcessEdgeInstance:
      type: object
      properties:
        edge_instance_id:
          type: integer
        from_node_instance_id:
          type: integer
        to_node_instance_id:
          type: integer
        edge_type:
          type: string
    ProcessInstanceResponse:
      type: object
      properties:
        instance_id:
          type: integer
        order_id:
          type: integer
        instance_status:
          type: string
        nodes:
          type: array
          items:
            "$ref": "#/components/schemas/ProcessNodeInstance"
        edges:
          type: array
          items:
            "$ref": "#/components/schemas/ProcessEdgeInstance"
    NodeActionResponse:
      type: object
      properties:
        node_instance_id:
          type: integer
        node_status:
          type: string
          enum:
          - READY
          - IN_PROGRESS
          - COMPLETED
          - SKIPPED
    SkipNodeRequest:
      type: object
      properties:
        reason:
          type: string
    CheckRecordRequest:
      type: object
      required:
      - node_instance_id
      - check_type
      - is_pass
      properties:
        node_instance_id:
          type: integer
        check_type:
          type: integer
          enum:
          - 1
          - 2
          description: 1=入检, 2=出检
        is_pass:
          type: boolean
        remark:
          type: string
        rework_to_node_id:
          type: integer
          description: 出检不通过时必填
    CheckRecordResponse:
      type: object
      properties:
        check_id:
          type: integer
        node_instance_id:
          type: integer
        check_type:
          type: integer
          enum:
          - 1
          - 2
        result:
          type: string
          enum:
          - PASS
          - FAIL
        rework_id:
          type: integer
          nullable: true
    ReworkRecordResponse:
      type: object
      properties:
        rework_id:
          type: integer
        order_id:
          type: integer
        order_no:
          type: string
        source_check_id:
          type: integer
        from_node_instance_id:
          type: integer
          nullable: true
        from_process_name:
          type: string
          nullable: true
        target_node_instance_id:
          type: integer
          nullable: true
        target_process_name:
          type: string
          nullable: true
        target_node_status:
          type: string
          nullable: true
        assigned_user_id:
          type: integer
          nullable: true
        reason_detail:
          type: string
          nullable: true
        status:
          type: string
        created_at:
          type: string
          format: date-time
    WorkLogStartRequest:
      type: object
      required:
      - node_instance_id
      properties:
        node_instance_id:
          type: integer
    WorkLogResponse:
      type: object
      properties:
        work_log_id:
          type: integer
        node_instance_id:
          type: integer
        worker_user_id:
          type: integer
        status:
          type: string
          enum:
          - IN_PROGRESS
          - PAUSED
          - COMPLETED
        pause_duration_seconds:
          type: integer
        effective_duration_seconds:
          type: integer
          nullable: true
    MessageRequest:
      type: object
      required:
      - content
      properties:
        content:
          type: string
        attachment_file_ids:
          type: array
          items:
            type: integer
        visible_to:
          type: string
          enum:
          - DOCTOR
          - DOCTOR_CS
          - INTERNAL
          - ALL
    MessageReviewRequest:
      type: object
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - APPROVE
          - REJECT
        edited_content:
          type: string
        review_note:
          type: string
    DesignDraftRequest:
      type: object
      required:
      - file_ids
      properties:
        file_ids:
          type: array
          items:
            type: integer
        upload_note:
          type: string
    DesignDraftResponse:
      type: object
      properties:
        draft_id:
          type: integer
        order_id:
          type: integer
        version:
          type: integer
        uploader_user_id:
          type: integer
          nullable: true
        file_id:
          type: integer
          nullable: true
        status:
          "$ref": "#/components/schemas/DraftStatus"
    DesignDraftReviewRequest:
      type: object
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - APPROVE
          - REJECT
        cs_reject_reason:
          type: string
    DoctorDraftConfirmRequest:
      type: object
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - CONFIRM
          - REJECT
        doctor_reject_reason:
          type: string
    BillRequest:
      type: object
      required:
      - file_id
      properties:
        file_id:
          type: integer
    BillResponse:
      type: object
      properties:
        bill_id:
          type: integer
          nullable: true
        order_id:
          type: integer
        bill_status:
          type: string
        file_id:
          type: integer
          nullable: true
    LogisticsRequest:
      type: object
      required:
      - carrier
      - tracking_no
      properties:
        carrier:
          type: string
        tracking_no:
          type: string
    LogisticsResponse:
      type: object
      properties:
        logistics_id:
          type: integer
          nullable: true
        order_id:
          type: integer
        carrier:
          type: string
        tracking_no:
          type: string
        logistics_status:
          type: string
    AiOrderOnlyRequest:
      type: object
      required:
      - order_id
      properties:
        order_id:
          type: integer
    AiQuestionRequest:
      type: object
      required:
      - order_id
      - question
      properties:
        order_id:
          type: integer
        question:
          type: string
    AiTranslateRequest:
      type: object
      required:
      - order_id
      - source_text
      properties:
        order_id:
          type: integer
        source_text:
          type: string
    AiTranslateResponse:
      type: object
      properties:
        translated_text:
          type: string
    AiAnswerResponse:
      type: object
      properties:
        answer:
          type: string
    AiProductionNoteResponse:
      type: object
      properties:
        draft_note:
          type: string
    MissingInfoResponse:
      type: object
      properties:
        is_complete:
          type: boolean
        missing_items:
          type: array
          items:
            type: object
            properties:
              field_key:
                type: string
              field_label:
                type: string
              tip:
                type: string
    NotificationItem:
      type: object
      properties:
        notification_id:
          type: integer
          format: int64
        event_id:
          type: integer
          format: int64
        event:
          type: string
          example: BILL_UPLOADED
        order_id:
          type: integer
          format: int64
          nullable: true
        order_no:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
          description: 面向接收人的脱敏通知文案
        read_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    NotificationListResponse:
      type: array
      items:
        "$ref": "#/components/schemas/NotificationItem"
    UnreadCountResponse:
      type: object
      properties:
        unread_count:
          type: integer
          format: int64
    MarkAllReadResponse:
      type: object
      properties:
        updated_count:
          type: integer
  responses:
    BadRequest:
      description: 请求参数错误或校验失败
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 未登录或 Token 无效
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 无权限或数据范围拒绝
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Conflict:
      description: 业务状态冲突或幂等冲突
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: 外部依赖或存储服务不可用
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    DefaultError:
      description: 未分类错误响应
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
security:
- BearerAuth: []
paths:
  "/auth/login":
    post:
      tags:
      - Auth
      summary: 登录
      description: 登录入口必须与账号角色匹配：DOCTOR=医生端，CS=客服端，PRODUCTION=生产端，ADMIN=管理端。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/CommonResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/LoginResponse"
        '401':
          description: 账号或密码错误
        '400':
          "$ref": "#/components/responses/BadRequest"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        default:
          "$ref": "#/components/responses/DefaultError"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      operationId: postAuthLogin
  "/auth/me":
    get:
      tags:
      - Auth
      summary: 当前登录用户
      responses:
        '200':
          description: 当前用户、权限码、数据范围和可见菜单
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CurrentUserResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/DefaultError"
      operationId: getAuthMe
  "/auth/refresh":
    post:
      tags:
      - Auth
      summary: 刷新 Access Token
      description: 使用仍有效且未登出的 refresh token 返回新的 accessToken；第一增量不轮换 refreshToken。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RefreshTokenRequest"
      responses:
        '200':
          description: 刷新成功，返回新的 accessToken 和原 refreshToken
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LoginResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        default:
          "$ref": "#/components/responses/DefaultError"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      operationId: postAuthRefresh
  "/auth/logout":
    post:
      tags:
      - Auth
      summary: 登出，服务端使 Token 失效
      description: 吊销请求体中的 refresh token；既有 accessToken 不做服务端黑名单，等待自然过期。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RefreshTokenRequest"
      responses:
        '200':
          description: 登出成功
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        default:
          "$ref": "#/components/responses/DefaultError"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      operationId: postAuthLogout
  "/users":
    get:
      tags:
      - User
      summary: 获取用户列表
      description: 权限：CS / ADMIN
      parameters:
      - name: role
        in: query
        schema:
          type: string
          enum:
          - DOCTOR
          - CS
          - WORKER
          - ADMIN
      - name: clinic_id
        in: query
        schema:
          type: integer
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: size
        in: query
        schema:
          type: integer
          default: 20
