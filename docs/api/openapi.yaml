  "/ai/external-alerts/receive":
    post:
      tags:
      - AI
      summary: AI 外部告警接收端验签 / 防重放验收桩
      description: |
        任务 9D.71 第一增量：本接口用于本地和测试环境验证外部告警接收端的 timestamp / nonce / HMAC 签名口径。
        默认 `AI_EXTERNAL_ALERT_RECEIVER_VERIFICATION_ENABLED=false`，接口返回 503，不接收任何真实外部服务。
        显式启用后，调用方必须提供 `X-AI-Alert-Timestamp`、`X-AI-Alert-Nonce` 和 `X-AI-Alert-Signature`；签名基串为 `timestamp.nonce.requestBody`，签名值为 `sha256=<HMAC-SHA256>`。
        同一进程 replay window 内重复 nonce 返回 409；超出 `AI_EXTERNAL_ALERT_RECEIVER_REPLAY_WINDOW_SECONDS` 时间窗或签名不匹配返回 401。
        响应不返回原始 payload、真实 webhook URL、密钥、prompt 原文、模型原始响应或内部生产敏感详情。
      parameters:
      - name: X-AI-Alert-Timestamp
        in: header
        required: true
        schema:
          type: string
        description: Unix epoch seconds；用于时间窗校验。
      - name: X-AI-Alert-Nonce
        in: header
        required: true
        schema:
          type: string
        description: 调用方生成的一次性随机值；同一接收端窗口内不可重复。
      - name: X-AI-Alert-Signature
        in: header
        required: true
        schema:
          type: string
        description: sha256=<HMAC-SHA256(timestamp.nonce.requestBody)>。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: 接收端验签通过
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/CommonResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/AiExternalAlertReceiverResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/DefaultError"
      operationId: postAiExternalAlertReceive
  "/notifications":
    get:
      tags:
      - Notification
      summary: 查询当前用户通知列表
      description: |
        权限：DOCTOR / CS / WORKER / ADMIN
        仅返回当前登录用户自己的 `user_notification` 记录。响应只包含通知事件的公开 payload 字段，不返回内部备注、内部状态、员工绩效或工序敏感信息。
        任务 9D.33 第一增量：AI 预算超限内部通知通过本接口返回给 ADMIN / CS，事件类型为 AI_BUDGET_EXCEEDED。
        任务 9D.34 第一增量：当 AI_BUDGET_NOTIFICATION_ENABLED=false 时，预算跨线只保留治理审计，不写入内部通知事实。
        任务 9D.35 第一增量：AI_BUDGET_CIRCUIT_OPEN 只写 ai_audit_log 治理审计，不写通知事实。
        任务 9D.37 第一增量：外部告警待发送事实写入 ai_external_alert_outbox，不通过本通知列表返回。
        任务 9D.41 第一增量：本地外部告警发送器可把 outbox 从 PENDING 推进为 SENT / FAILED，并记录 attempts 和 last_error。
        任务 9D.43 第一增量：默认不外呼；显式设置 AI_EXTERNAL_ALERT_WEBHOOK_ENABLED=true 和 AI_EXTERNAL_ALERT_WEBHOOK_URL 后，EXTERNAL_ALERT 会 POST webhook。
        任务 9D.44 第一增量：默认不自动调度；显式设置 AI_EXTERNAL_ALERT_SCHEDULER_ENABLED=true 后，调度器会按配置批量触发现有 sender。
        任务 9D.45 第一增量：webhook 失败时按 AI_EXTERNAL_ALERT_MAX_ATTEMPTS 控制重试；未达上限保持 PENDING，达到上限进入 DEAD_LETTER，并保留 last_error。
        任务 9D.46 第一增量：sender 先领取 PENDING 为事务内 SENDING，再执行 webhook 发送，避免重复触发或并发 sender 对同一条 outbox 重复外呼。
        任务 9D.47 第一增量：显式启用 AI_EXTERNAL_ALERT_WEBHOOK_SIGNING_ENABLED 且注入 AI_EXTERNAL_ALERT_WEBHOOK_SIGNING_SECRET 后，sender 会给 webhook 请求增加 X-AI-Alert-Timestamp、X-AI-Alert-Nonce 和 X-AI-Alert-Signature HMAC-SHA256 签名头。
        任务 9D.71 第一增量：接收端验签 / 防重放验收桩默认关闭，显式启用并注入 receiver signing secret 后校验 timestamp、nonce 和 HMAC 签名。
      parameters:
      - name: unread_only
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          maximum: 100
      responses:
        '200':
          description: 当前用户通知列表
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/CommonResponse"
                - type: object
                  properties:
