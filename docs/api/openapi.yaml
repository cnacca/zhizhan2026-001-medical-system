  "/files/upload-token":
    post:
      tags:
      - File
      summary: 获取单文件 PUT 直传预签名上传 Token
      description: |
        权限：DOCTOR / CS / WORKER / ADMIN
        前端使用此接口获取 MinIO 单对象 PUT 预签名上传地址，直传到 MinIO 私有桶；服务端不做文件内容中转。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UploadTokenRequest"
      responses:
        '200':
          description: 返回预签名 PUT 上传地址和 file_id
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/CommonResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/UploadTokenResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        default:
          "$ref": "#/components/responses/DefaultError"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      operationId: postFilesUploadToken
  "/files/multipart/initiate":
    post:
      tags:
      - File
      summary: 初始化 MinIO Multipart 上传
      description: |
        权限：DOCTOR / CS / WORKER / ADMIN
        创建 file_resource=PENDING/MULTIPART 记录并返回 upload_id、part_size、part_count；医生只能向本人可访问订单上传医生可见文件。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MultipartInitiateRequest"
      responses:
        '200':
          description: Multipart 初始化成功
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/CommonResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/MultipartInitiateResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        default:
          "$ref": "#/components/responses/DefaultError"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      operationId: postFilesMultipartInitiate
  "/files/multipart/pending":
    get:
      tags:
      - File
      summary: 列出订单下未完成 Multipart 上传
      description: |
        权限：DOCTOR / CS / WORKER / ADMIN。用于断点续传恢复候选列表；医生只能看到本人创建的医生可见未完成 Multipart 文件，响应不暴露 object_key。
      parameters:
      - name: order_id
        in: query
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: 返回当前订单可恢复的 Multipart 上传候选
          content:
            application/json:
