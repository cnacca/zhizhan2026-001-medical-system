openapi: 3.0.3
info:
  title: AI 智能下单与生产协同平台 API
  version: 1.0.0
  description: |
    牙科定制工厂三端系统（医生端 / 客服端 / 生产端 / 管理端）后端 API 规范。

    ## 认证方式
    所有接口（除登录外）必须携带 Authorization: Bearer {access_token}。
    服务端对每个接口强制校验角色权限，禁止仅靠前端隐藏。

    ## 角色枚举
    - DOCTOR：医生
    - CS：客服
    - WORKER：技工/生产人员
    - ADMIN：超级管理员

    ## 通用响应格式
    所有接口统一返回：
    { "code": 200, "msg": "success", "data": {} }
    错误时：
    { "code": 4xx/5xx, "msg": "错误说明", "data": null }
  license:
    name: Proprietary internal API
    url: https://yourdomain.com/legal/proprietary-api-license
servers:
- url: https://api.yourdomain.com/v1
  description: 正式环境
- url: https://test-api.yourdomain.com/v1
  description: 测试环境
tags:
- name: Auth
  description: 认证与 Token 管理
- name: User
  description: 用户与账号管理
- name: Clinic
  description: 诊所与客户档案
- name: Order
  description: 订单核心流程
- name: OrderForm
  description: 动态表单配置
- name: File
  description: 文件上传与预览
- name: WorkflowChain
  description: 工序链查询（预定义，只读）
- name: ProcessInstance
  description: 订单工序链实例
- name: CheckRecord
  description: 入检 / 出检记录
- name: Quality
  description: 质量记录与外返登记
- name: WorkLog
  description: 工时记录
- name: Performance
  description: 绩效统计
- name: Staff
  description: 人员档案与工作量看板
- name: Message
  description: 消息与留言系统
- name: DesignDraft
  description: 设计稿模块
- name: Bill
  description: 账单与物流
- name: CustomerPreference
  description: 客户偏好
- name: AI
  description: AI 智能体接口
- name: Dashboard
  description: 内部看板与一期 A/B 本地统计
- name: Notification
  description: 通知 REST 与 WebSocket 事件定义
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CommonResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
          example: success
        data: {}
    LoginRequest:
      type: object
      required:
      - username
      - password
      - portal
      properties:
        username:
          type: string
          example: doctor001
        password:
          type: string
          example: "******"
        portal:
          type: string
          description: 登录入口；服务端会校验账号角色是否匹配所选入口。
          enum:
          - DOCTOR
          - CS
          - PRODUCTION
          - ADMIN
          example: DOCTOR
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: 服务端签发的 Bearer token
        refreshToken:
          type: string
          description: 服务端签发的刷新令牌；客户端仅提交给 refresh/logout，不作为 Bearer token 使用
        username:
          type: string
        userId:
          type: integer
          format: int64
          nullable: true
        clinicId:
          type: integer
          format: int64
          nullable: true
        roles:
          type: array
          items:
            type: string
            enum:
            - DOCTOR
            - CS
            - WORKER
            - ADMIN
        permissions:
          type: array
          items:
            type: string
          description: 当前账号角色聚合后的权限码
        menus:
          type: array
          items:
            "$ref": "#/components/schemas/AuthMenu"
          description: 当前账号可见菜单，用于前端权限路由
        dataScope:
          type: string
          nullable: true
          enum:
          - ALL
          - CLINIC
          - SELF
          - NONE
          description: 当前账号的数据范围
        expiresAt:
          type: string
          format: date-time
        refreshExpiresAt:
          type: string
          format: date-time
    RefreshTokenRequest:
      type: object
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
          description: 登录或最近一次刷新时返回的 refreshToken；刷新成功后客户端必须替换本地保存的 refreshToken
    CurrentUserResponse:
      type: object
      properties:
        username:
          type: string
        userId:
          type: integer
          format: int64
          nullable: true
        clinicId:
          type: integer
          format: int64
          nullable: true
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        menus:
          type: array
          items:
            "$ref": "#/components/schemas/AuthMenu"
        dataScope:
          type: string
          nullable: true
    DoctorAccountSettings:
      type: object
      description: 医生端账户设置第一增量；不返回 password_hash、token 或内部生产信息。
      properties:
        user_id:
          type: integer
          format: int64
        username:
          type: string
        display_name:
          type: string
        contact_email:
          type: string
          nullable: true
        contact_phone:
          type: string
          nullable: true
        shipping_address:
          type: string
          nullable: true
        notification_push_enabled:
          type: boolean
    DoctorAccountSettingsRequest:
      type: object
      required:
      - display_name
      properties:
        display_name:
          type: string
        contact_email:
          type: string
          nullable: true
        contact_phone:
          type: string
          nullable: true
        shipping_address:
          type: string
          nullable: true
        notification_push_enabled:
          type: boolean
          default: true
    DoctorPasswordUpdateRequest:
      type: object
      required:
      - current_password
      - new_password
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
    AuthMenu:
      type: object
      properties:
        menuCode:
          type: string
          example: internal-orders
        menuName:
          type: string
          example: 内部订单
        menuType:
          type: string
          example: MENU
        routePath:
          type: string
          nullable: true
          example: /orders/internal
        componentPath:
          type: string
          nullable: true
          example: InternalOrdersView
        permissionCode:
          type: string
          nullable: true
          example: order:read-internal
        icon:
          type: string
          nullable: true
        sortOrder:
          type: integer
          nullable: true
    OrderStatus:
      type: string
      enum:
      - DRAFT
      - PENDING_REVIEW
      - DESIGNING
      - PRODUCING
      - QC
      - PENDING_SHIP
      - SHIPPED
      - COMPLETED
      description: |
        外部状态枚举（医生端可见）：
        DRAFT=草稿, PENDING_REVIEW=待审核, DESIGNING=设计中, PRODUCING=生产中,
        QC=质检中, PENDING_SHIP=待发货, SHIPPED=已发货, COMPLETED=已完成
    OrderBrief:
      type: object
      properties:
        order_id:
          type: integer
        patient_id:
          type: integer
          nullable: true
        order_no:
          type: string
        product_type:
          type: string
        external_status:
          "$ref": "#/components/schemas/OrderStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        clinic_name:
          type: string
    DoctorOrderSummary:
      type: object
      description: 医生端订单列表/详情脱敏视图，不包含 internal_status、production_note、cs_user_id。
      properties:
        order_id:
          type: integer
        order_no:
          type: string
        product_type:
          type: string
        external_status:
          "$ref": "#/components/schemas/OrderStatus"
        editable:
          type: boolean
          description: 是否允许医生继续编辑或补资料；仅草稿、客服驳回、生产驳回状态为 true，不暴露内部状态。
        form_data:
          type: object
        public_message:
          type: string
          nullable: true
        bill_status:
          type: string
          nullable: true
        logistics_status:
          type: string
          nullable: true
        tracking_no:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreatePatientRequest:
      type: object
      required:
      - patient_name
      properties:
        patient_name:
          type: string
          example: 林一舟
        patient_age:
          type: integer
          nullable: true
          example: 42
        patient_gender:
          type: string
          nullable: true
          example: 男
        date_of_birth:
          type: string
          format: date
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        medical_notes:
          type: string
          nullable: true
          description: 患者主动提供的病史、用药、过敏及特殊注意事项。
        tags:
          type: string
          nullable: true
          description: 使用逗号分隔的轻量患者标签。
        treatment_status:
          type: string
          enum:
          - IN_TREATMENT
          - FOLLOW_UP
          - TREATMENT_ENDED
          - ARCHIVED
          default: IN_TREATMENT
        treatment_started_at:
          type: string
          format: date
          nullable: true
        treatment_ended_at:
          type: string
          format: date
          nullable: true
        oral_description:
          type: string
          nullable: true
          description: 口腔情况与修复关注点摘要。
    UpdatePatientRequest:
      allOf:
      - "$ref": "#/components/schemas/CreatePatientRequest"
      description: 更新患者档案；归属诊所和负责医生不可通过该请求变更。
    PatientRecord:
      type: object
      description: 医生端患者档案基础视图，只返回当前医生本人患者。
      properties:
        patient_id:
          type: integer
        clinic_id:
          type: integer
        doctor_user_id:
          type: integer
        patient_name:
          type: string
        patient_age:
          type: integer
          nullable: true
        patient_gender:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        medical_notes:
          type: string
          nullable: true
        tags:
          type: string
          nullable: true
        treatment_status:
          type: string
          enum:
          - IN_TREATMENT
          - FOLLOW_UP
          - TREATMENT_ENDED
          - ARCHIVED
        treatment_started_at:
          type: string
          format: date
          nullable: true
        treatment_ended_at:
          type: string
          format: date
          nullable: true
        oral_description:
          type: string
          nullable: true
        order_count:
          type: integer
        latest_order_no:
          type: string
          nullable: true
        latest_product_type:
          type: string
          nullable: true
        latest_order_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PatientOrder:
      type: object
      description: 患者历史订单的医生端脱敏视图，不返回 internal_status / production_note。
      properties:
        order_id:
          type: integer
        order_no:
          type: string
        product_type:
          type: string
        external_status:
          "$ref": "#/components/schemas/OrderStatus"
        created_at:
          type: string
          format: date-time
    PatientListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/PatientRecord"
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
    PatientOrderListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/PatientOrder"
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
    CreateClinicRequest:
      type: object
      required:
      - clinic_name
      properties:
        clinic_code:
          type: string
          nullable: true
          description: 客户编码；未填写时由服务端生成 KH 开头编码。
        clinic_name:
          type: string
          example: 本地测试诊所
        contact_name:
          type: string
          nullable: true
        contact_phone:
          type: string
          nullable: true
        contact_email:
          type: string
          nullable: true
        business_region:
          type: string
          nullable: true
        salesperson:
          type: string
          nullable: true
        customer_type:
          type: string
          nullable: true
        settlement_type:
          type: string
          nullable: true
        organization_nature:
          type: string
          nullable: true
        business_level:
          type: string
          nullable: true
        default_shipping_method:
          type: string
          nullable: true
    Clinic:
      type: object
      description: 客户主档列表视图；客户专属价格、单据模板、黑名单和子档案通过 management 接口维护。
      properties:
        clinic_id:
          type: integer
        clinic_code:
          type: string
        clinic_name:
          type: string
        contact_name:
          type: string
          nullable: true
        contact_phone:
          type: string
          nullable: true
        contact_email:
          type: string
          nullable: true
        business_region:
          type: string
          nullable: true
        salesperson:
          type: string
          nullable: true
        customer_type:
          type: string
          nullable: true
        settlement_type:
          type: string
          nullable: true
        organization_nature:
          type: string
          nullable: true
        business_level:
          type: string
          nullable: true
        default_shipping_method:
          type: string
          nullable: true
        status:
          type: string
        blacklisted:
          type: boolean
        preference_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ClinicListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Clinic"
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
    ClinicManagementRequest:
      type: object
      required:
      - clinic_code
      - clinic_name
      properties:
        clinic_code:
          type: string
        clinic_name:
          type: string
        contact_name:
          type: string
          nullable: true
        contact_phone:
          type: string
          nullable: true
        contact_email:
          type: string
          nullable: true
        business_region:
          type: string
          nullable: true
        salesperson:
          type: string
          nullable: true
        customer_type:
          type: string
          nullable: true
        settlement_type:
          type: string
          nullable: true
        organization_nature:
          type: string
          nullable: true
        business_level:
          type: string
          nullable: true
        default_shipping_method:
          type: string
          nullable: true
        status:
          type: string
        invoice_profile:
          type: object
          additionalProperties: true
        addresses:
          type: array
          items:
            type: object
            additionalProperties: true
        doctors:
          type: array
          items:
            type: object
            additionalProperties: true
        documents:
          type: array
          items:
            type: object
            additionalProperties: true
        prices:
          type: array
          items:
            type: object
            additionalProperties: true
        preferences:
          type: object
          additionalProperties: true
        template_bindings:
          type: array
          items:
            type: object
            required:
            - document_type
            - template_id
            properties:
              document_type:
                type: string
              template_id:
                type: integer
    ClinicManagementResponse:
      type: object
      description: 客户主档、开票、收货地址、主要医生、资质合同、专属价格、打印模板、偏好、黑名单与审计记录的聚合视图。
      properties:
        clinic:
          "$ref": "#/components/schemas/Clinic"
        invoice_profile:
          type: object
          nullable: true
          additionalProperties: true
        addresses:
          type: array
          items:
            type: object
            additionalProperties: true
        doctors:
          type: array
          items:
            type: object
            additionalProperties: true
        documents:
          type: array
          items:
            type: object
            additionalProperties: true
        prices:
          type: array
          items:
            type: object
            additionalProperties: true
        preferences:
          type: object
          additionalProperties: true
        available_templates:
          type: array
          items:
            type: object
            additionalProperties: true
        template_bindings:
          type: array
          items:
            type: object
            additionalProperties: true
        blacklist:
          type: object
          nullable: true
          additionalProperties: true
        change_logs:
          type: array
          items:
            type: object
            additionalProperties: true
    BlacklistClinicRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
        overdue_amount_cents:
          type: integer
          nullable: true
    ReleaseClinicBlacklistRequest:
      type: object
      required:
      - release_reason
      properties:
        release_reason:
          type: string
    ClinicPreference:
      type: object
      description: 一期客户偏好基础视图；医生只能读取本人诊所偏好，CS / ADMIN 可覆盖维护。
      properties:
        clinic_id:
          type: integer
        clinic_name:
          type: string
        preferences:
          type: object
          properties:
            color:
              type: string
              nullable: true
            contact:
              type: string
              nullable: true
            margin:
              type: string
              nullable: true
            shape:
              type: string
              nullable: true
            material:
              type: string
              nullable: true
            note:
              type: string
              nullable: true
        updated_at:
          type: string
          format: date-time
    ClinicPreferenceRequest:
      type: object
      properties:
        color:
          type: string
          nullable: true
          description: 颜色/色号偏好
        contact:
          type: string
          nullable: true
          description: 邻接关系偏好
        margin:
          type: string
          nullable: true
          description: 边缘设计偏好
        shape:
          type: string
          nullable: true
          description: 外形偏好
        material:
          type: string
          nullable: true
          description: 材料偏好
        note:
          type: string
          nullable: true
          description: 其他备注
    OrderListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            oneOf:
            - "$ref": "#/components/schemas/DoctorOrderSummary"
            - "$ref": "#/components/schemas/OrderDetail"
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
    FormFieldConfig:
      type: object
      properties:
        field_id:
          type: integer
        product_type:
          type: string
        field_key:
          type: string
        field_label:
          type: string
        field_type:
          type: string
          enum:
          - text
          - textarea
          - select
          - multi-select
          - number
          - date
          - file
        is_required:
          type: boolean
        options:
          type: array
          items:
            type: string
        sort_order:
          type: integer
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
    ProductCatalogItem:
      type: object
      properties:
        product_id:
          type: integer
        product_type:
          type: string
          description: 产品类型编码，服务端统一转为大写下划线格式。
        product_name:
          type: string
        material_spec:
          type: string
          nullable: true
          description: 一期人工维护的材料/规格说明。
        base_price_cents:
          type: integer
          description: 一期人工维护基础价，单位分；不代表自动报价或最终结算。
        currency:
          type: string
          example: CNY
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        price_note:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductCatalogRequest:
      type: object
      required:
      - product_type
      - product_name
      - base_price_cents
      properties:
        product_type:
          type: string
        product_name:
          type: string
        material_spec:
          type: string
        base_price_cents:
          type: integer
        currency:
          type: string
          default: CNY
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        price_note:
          type: string
    UpdateProductCatalogRequest:
      type: object
      required:
      - product_name
      - base_price_cents
      properties:
        product_name:
          type: string
        material_spec:
          type: string
        base_price_cents:
          type: integer
        currency:
          type: string
          default: CNY
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        price_note:
          type: string
    CreateOrderRequest:
      type: object
      required:
      - product_type
      - form_data
      properties:
        patient_id:
          type: integer
          nullable: true
          description: 9D.83 医生本人患者档案 ID；后端校验 clinic_id 与 doctor_user_id 归属。
        product_type:
          type: string
          example: REGULAR_CROWN
        form_data:
          type: object
          description: 动态表单填写内容，key 为 field_key，value 为填写值。
          example:
            patient_name: 张三
            tooth_position: '11,21'
            material: 氧化锆
        file_ids:
          type: array
          items:
            type: integer
          description: 已完成且医生本人可绑定的 file_id 列表。
        is_draft:
          type: boolean
          default: false
          description: true 时保存医生草稿，不进入客服审核队列；false 或缺省时提交到客服初审。
    UpdateOrderRequest:
      type: object
      required:
      - product_type
      - form_data
      properties:
        patient_id:
          type: integer
          nullable: true
          description: 9D.83 医生本人患者档案 ID；为空则不绑定患者档案。
        product_type:
          type: string
          example: REGULAR_CROWN
        form_data:
