  "/performance":
    get:
      tags:
      - Performance
      summary: 获取绩效统计
      description: |
        权限：WORKER（只返回本人数据）/ ADMIN（可查全部）
        绩效计算公式：
        - 完成数量 = 完成工序数（node_status=COMPLETED）
        - 有效工时 = SUM(actual_duration)
        - 返工次数 = 返工记录次数
        - 准时率 = 按标准工时内完成工序数 ÷ 总完成工序数
        - 通过率 = 一次出检通过数 ÷ 总出检数
        - 工时效率 = SUM(standard_duration) ÷ SUM(actual_duration) × 100%
      parameters:
      - name: user_id
        in: query
        schema:
          type: integer
          description: ADMIN 专用，不传则返回当前登录人
      - name: start_date
        in: query
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: 绩效统计结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/PerformanceStats"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        default:
          "$ref": "#/components/responses/DefaultError"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      operationId: getPerformance
