name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ai-order-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.PRODUCTION_AUTO_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
      url: https://chinesedigitaldental.com

    steps:
      - name: Check out the exact release revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile

      - name: Run release gates
        shell: bash
        run: |
          set -euo pipefail
          npm run acceptance
          npm run check:production-auto-deploy
          npm run check:deployment-env
          npm run check:deployment-bugfixes-20260811
          npm run check:task9d69
          npm run compose:phase-one:config
          npm run build:frontend
          mvn -f backend/pom.xml -pl platform-server -am -DskipTests package

      - name: Build immutable release images
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --file backend/platform-server/Dockerfile \
            --tag "ai-order-platform-backend:${GITHUB_SHA}" \
            .
          docker build \
            --file frontend/Dockerfile \
            --tag "ai-order-platform-frontend:${GITHUB_SHA}" \
            .

      - name: Package the release
        id: package
        shell: bash
        run: |
          set -euo pipefail
          package_dir="${RUNNER_TEMP}/ai-order-${GITHUB_SHA}"
          install -d -m 700 "${package_dir}"

          git archive \
            --format=tar.gz \
            --output="${package_dir}/source-${GITHUB_SHA}.tar.gz" \
            "${GITHUB_SHA}"

          docker save \
            "ai-order-platform-backend:${GITHUB_SHA}" \
            "ai-order-platform-frontend:${GITHUB_SHA}" \
            | gzip -1 >"${package_dir}/images-${GITHUB_SHA}.tar.gz"

          (
            cd "${package_dir}"
            sha256sum \
              "source-${GITHUB_SHA}.tar.gz" \
              "images-${GITHUB_SHA}.tar.gz" \
              >"checksums-${GITHUB_SHA}.sha256"
          )

          printf 'package_dir=%s\n' "${package_dir}" >>"${GITHUB_OUTPUT}"

      - name: Configure production SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?missing PRODUCTION_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?missing PRODUCTION_SSH_KNOWN_HOSTS}"
          : "${SSH_HOST:?missing PRODUCTION_SSH_HOST}"
          : "${SSH_USER:?missing PRODUCTION_SSH_USER}"

          install -d -m 700 "${HOME}/.ssh"
          install -m 600 /dev/null "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${SSH_PRIVATE_KEY}" >"${HOME}/.ssh/id_ed25519"
          install -m 600 /dev/null "${HOME}/.ssh/known_hosts"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" >"${HOME}/.ssh/known_hosts"

      - name: Upload verified release bundle
        shell: bash
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PACKAGE_DIR: ${{ steps.package.outputs.package_dir }}
        run: |
          set -euo pipefail
          remote_stage=".cache/ai-order-deploy/${GITHUB_SHA}"
          ssh \
            -i "${HOME}/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "install -d -m 700 \"\$HOME/${remote_stage}\""

          scp \
            -i "${HOME}/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${PACKAGE_DIR}/source-${GITHUB_SHA}.tar.gz" \
            "${PACKAGE_DIR}/images-${GITHUB_SHA}.tar.gz" \
            "${PACKAGE_DIR}/checksums-${GITHUB_SHA}.sha256" \
            scripts/deploy-production-release.sh \
            "${SSH_USER}@${SSH_HOST}:${remote_stage}/"

      - name: Deploy and verify production
        shell: bash
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          remote_stage=".cache/ai-order-deploy/${GITHUB_SHA}"
          ssh \
            -i "${HOME}/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "bash '${remote_stage}/deploy-production-release.sh' \
              '${GITHUB_SHA}' \
              '${remote_stage}/source-${GITHUB_SHA}.tar.gz' \
              '${remote_stage}/images-${GITHUB_SHA}.tar.gz' \
              '${remote_stage}/checksums-${GITHUB_SHA}.sha256'"
