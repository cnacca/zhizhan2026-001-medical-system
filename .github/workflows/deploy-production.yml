name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      diagnose_only:
        description: Run read-only production CORS diagnostics without deploying
        required: false
        default: false
        type: boolean
      repair_cors_alias:
        description: Add the controlled www origin to production CORS and recreate only the backend
        required: false
        default: false
        type: boolean

concurrency:
  group: ai-order-production
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  diagnose-production-cors:
    if: github.event_name == 'workflow_dispatch' && (inputs.diagnose_only == true || inputs.repair_cors_alias == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production

    steps:
      - name: Configure production SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?missing PRODUCTION_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?missing PRODUCTION_SSH_KNOWN_HOSTS}"
          install -d -m 700 "${HOME}/.ssh"
          install -m 600 /dev/null "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${SSH_PRIVATE_KEY}" >"${HOME}/.ssh/id_ed25519"
          install -m 600 /dev/null "${HOME}/.ssh/known_hosts"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" >"${HOME}/.ssh/known_hosts"

      - name: Collect filtered CORS runtime evidence
        if: inputs.diagnose_only == true
        shell: bash
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?missing PRODUCTION_SSH_HOST}"
          : "${SSH_USER:?missing PRODUCTION_SSH_USER}"
          ssh \
            -i "${HOME}/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          evidence_since='2026-08-15T07:55:00Z'
          evidence_until='2026-08-15T08:06:00Z'

          date -u '+server_now=%Y-%m-%dT%H:%M:%SZ'
          docker inspect ai-order-backend \
            --format 'backend_id={{.Id}} backend_started={{.State.StartedAt}} backend_restart_count={{.RestartCount}} backend_image={{.Config.Image}}'
          docker inspect ai-order-frontend \
            --format 'frontend_id={{.Id}} frontend_started={{.State.StartedAt}} frontend_restart_count={{.RestartCount}} frontend_image={{.Config.Image}}'
          docker inspect ai-order-backend \
            --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | sed -n -E '/^(APP_CORS_ALLOWED_ORIGIN|SPRING_PROFILES_ACTIVE|SERVER_PORT)=/p'

          docker events \
            --since "${evidence_since}" \
            --until "${evidence_until}" \
            --filter container=ai-order-backend \
            --filter container=ai-order-frontend \
            --format 'docker_event={{.Time}}|{{.Type}}|{{.Action}}|{{.Actor.Attributes.name}}' \
            || true

          docker logs \
            --since "${evidence_since}" \
            --until "${evidence_until}" \
            ai-order-backend 2>&1 \
            | grep -E 'Invalid CORS|CORS|origin|Origin|Tomcat started|Started PlatformServerApplication|Stopping service' \
            | tail -n 200 \
            || true

          docker logs \
            --since "${evidence_since}" \
            --until "${evidence_until}" \
            ai-order-frontend 2>&1 \
            | grep -E 'POST /api/auth/login' \
            | tail -n 200 \
            || true
          REMOTE

      - name: Repair production CORS alias atomically
        if: inputs.repair_cors_alias == true
        shell: bash
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?missing PRODUCTION_SSH_HOST}"
          : "${SSH_USER:?missing PRODUCTION_SSH_USER}"
          ssh \
            -i "${HOME}/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          config_file="${AI_ORDER_DEPLOY_CONFIG:-$HOME/.config/ai-order-platform/deploy.conf}"
          [[ -f "${config_file}" && ! -L "${config_file}" ]]
          # shellcheck disable=SC1090
          source "${config_file}"
          : "${RELEASE_ROOT:?RELEASE_ROOT missing}"
          : "${PRODUCTION_ENV_FILE:?PRODUCTION_ENV_FILE missing}"
          : "${COMPOSE_OVERRIDE_FILE:?COMPOSE_OVERRIDE_FILE missing}"
          : "${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME missing}"

          canonical_origin='https://chinesedigitaldental.com'
          alias_origin='https://www.chinesedigitaldental.com'
          expected_line="APP_CORS_ALLOWED_ORIGIN=${canonical_origin}"
          repaired_line="APP_CORS_ALLOWED_ORIGIN=${canonical_origin},${alias_origin}"
          current_line="$(grep -E '^APP_CORS_ALLOWED_ORIGIN=' "${PRODUCTION_ENV_FILE}")"
          [[ "${current_line}" == "${expected_line}" || "${current_line}" == "${repaired_line}" ]]

          if [[ "${current_line}" != "${repaired_line}" ]]; then
            backup_file="${PRODUCTION_ENV_FILE}.cors-backup-$(date -u +%Y%m%dT%H%M%SZ)"
            temp_file="${PRODUCTION_ENV_FILE}.cors-update.$$"
            trap 'rm -f "${temp_file:-}"' EXIT
            install -m 600 "${PRODUCTION_ENV_FILE}" "${backup_file}"
            awk -v replacement="${repaired_line}" '
              BEGIN { count = 0 }
              /^APP_CORS_ALLOWED_ORIGIN=/ { print replacement; count += 1; next }
              { print }
              END { if (count != 1) exit 42 }
            ' "${PRODUCTION_ENV_FILE}" >"${temp_file}"
            chmod --reference="${PRODUCTION_ENV_FILE}" "${temp_file}"
            mv "${temp_file}" "${PRODUCTION_ENV_FILE}"
            trap - EXIT
            printf 'production CORS env updated; backup=%s\n' "${backup_file}"
          else
            printf 'production CORS env already includes canonical and www origins\n'
          fi

          revision="$(<"${RELEASE_ROOT}/current-production-revision")"
          [[ "${revision}" =~ ^[0-9a-f]{40}$ ]]
          release_dir="${RELEASE_ROOT}/ai-order-${revision:0:12}"
          compose_file="${release_dir}/deploy/docker-compose.phase-one.yml"
          [[ -f "${compose_file}" && ! -L "${compose_file}" ]]
          compose=(
            docker compose
            --project-name "${COMPOSE_PROJECT_NAME}"
            --file "${compose_file}"
            --file "${COMPOSE_OVERRIDE_FILE}"
            --env-file "${PRODUCTION_ENV_FILE}"
          )
          "${compose[@]}" config >/dev/null
          "${compose[@]}" up -d --no-build --no-deps --force-recreate --wait backend

          for allowed_origin in "${canonical_origin}" "${alias_origin}"; do
            header_file="$(mktemp)"
            body_file="$(mktemp)"
            status_code="$(curl \
              --silent --show-error --max-time 10 \
              --dump-header "${header_file}" \
              --output "${body_file}" \
              --write-out '%{http_code}' \
              --request POST http://127.0.0.1:8088/api/auth/login \
              --header "Origin: ${allowed_origin}" \
              --header 'Content-Type: application/json' \
              --data '{"username":"nonexistent-cors-check","password":"invalid","portal":"DOCTOR"}')"
            [[ "${status_code}" == '401' ]]
            grep -Fqi "Access-Control-Allow-Origin: ${allowed_origin}" "${header_file}"
            rm -f "${header_file}" "${body_file}"
            printf 'CORS probe passed for %s\n' "${allowed_origin}"
          done
          REMOTE

  build-and-deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.PRODUCTION_AUTO_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
      url: https://chinesedigitaldental.com

    steps:
      - name: Check out the exact release revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Require a merged pull request for automatic production deploys
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --header 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            | jq --exit-status \
              --arg revision "${GITHUB_SHA}" \
              'any(.[]; .merged_at != null and .base.ref == "main" and .merge_commit_sha == $revision)' \
              >/dev/null

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile

      - name: Run release gates
        shell: bash
        run: |
          set -euo pipefail
          npm run acceptance
          npm run check:production-auto-deploy
          npm run check:deployment-env
          npm run check:deployment-bugfixes-20260811
          npm run check:task9d69
          npm run compose:phase-one:config
          npm run build:frontend
          mvn -f backend/pom.xml -pl platform-server -am -DskipTests package

      - name: Build immutable release images
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --file backend/platform-server/Dockerfile \
            --tag "ai-order-platform-backend:${GITHUB_SHA}" \
            .
          docker build \
            --file frontend/Dockerfile \
            --build-arg "VITE_TEMP_DEMO_LOGIN_PREFILL_ENABLED=${{ vars.TEMP_DEMO_LOGIN_PREFILL_ENABLED || 'false' }}" \
            --tag "ai-order-platform-frontend:${GITHUB_SHA}" \
            .

      - name: Package the release
        id: package
        shell: bash
        run: |
          set -euo pipefail
          package_dir="${RUNNER_TEMP}/ai-order-${GITHUB_SHA}"
          install -d -m 700 "${package_dir}"

          git archive \
            --format=tar.gz \
            --output="${package_dir}/source-${GITHUB_SHA}.tar.gz" \
            "${GITHUB_SHA}"

          docker save \
            "ai-order-platform-backend:${GITHUB_SHA}" \
            "ai-order-platform-frontend:${GITHUB_SHA}" \
            | gzip -1 >"${package_dir}/images-${GITHUB_SHA}.tar.gz"

          (
            cd "${package_dir}"
            sha256sum \
              "source-${GITHUB_SHA}.tar.gz" \
              "images-${GITHUB_SHA}.tar.gz" \
              >"checksums-${GITHUB_SHA}.sha256"
          )

          printf 'package_dir=%s\n' "${package_dir}" >>"${GITHUB_OUTPUT}"

      - name: Configure production SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?missing PRODUCTION_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?missing PRODUCTION_SSH_KNOWN_HOSTS}"
          : "${SSH_HOST:?missing PRODUCTION_SSH_HOST}"
          : "${SSH_USER:?missing PRODUCTION_SSH_USER}"

          install -d -m 700 "${HOME}/.ssh"
          install -m 600 /dev/null "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${SSH_PRIVATE_KEY}" >"${HOME}/.ssh/id_ed25519"
          install -m 600 /dev/null "${HOME}/.ssh/known_hosts"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" >"${HOME}/.ssh/known_hosts"

      - name: Upload verified release bundle
        shell: bash
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PACKAGE_DIR: ${{ steps.package.outputs.package_dir }}
        run: |
          set -euo pipefail
          remote_stage=".cache/ai-order-deploy/${GITHUB_SHA}"
          ssh \
            -i "${HOME}/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "install -d -m 700 \"\$HOME/${remote_stage}\""

          scp \
            -i "${HOME}/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${PACKAGE_DIR}/source-${GITHUB_SHA}.tar.gz" \
            "${PACKAGE_DIR}/images-${GITHUB_SHA}.tar.gz" \
            "${PACKAGE_DIR}/checksums-${GITHUB_SHA}.sha256" \
            scripts/deploy-production-release.sh \
            "${SSH_USER}@${SSH_HOST}:${remote_stage}/"

      - name: Deploy and verify production
        shell: bash
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          remote_stage=".cache/ai-order-deploy/${GITHUB_SHA}"
          ssh \
            -i "${HOME}/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "bash '${remote_stage}/deploy-production-release.sh' \
              '${GITHUB_SHA}' \
              '${remote_stage}/source-${GITHUB_SHA}.tar.gz' \
              '${remote_stage}/images-${GITHUB_SHA}.tar.gz' \
              '${remote_stage}/checksums-${GITHUB_SHA}.sha256'"
