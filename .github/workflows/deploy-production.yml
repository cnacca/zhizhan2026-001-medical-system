name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ai-order-production
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.PRODUCTION_AUTO_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
      url: https://chinesedigitaldental.com

    steps:
      - name: Check out the exact release revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Require a merged pull request for automatic production deploys
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --header 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            | jq --exit-status \
              --arg revision "${GITHUB_SHA}" \
              'any(.[]; .merged_at != null and .base.ref == "main" and .merge_commit_sha == $revision)' \
              >/dev/null

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile

      - name: Run release gates
        shell: bash
        run: |
          set -euo pipefail
          npm run acceptance
          npm run check:production-auto-deploy
          npm run check:deployment-env
          npm run check:deployment-bugfixes-20260811
          npm run check:task9d69
          npm run compose:phase-one:config
          npm run build:frontend
          mvn -f backend/pom.xml -pl platform-server -am -DskipTests package

      - name: Build immutable release images
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --file backend/platform-server/Dockerfile \
            --tag "ai-order-platform-backend:${GITHUB_SHA}" \
            .
          docker build \
            --file frontend/Dockerfile \
            --build-arg "VITE_TEMP_DEMO_LOGIN_PREFILL_ENABLED=${{ vars.TEMP_DEMO_LOGIN_PREFILL_ENABLED || 'false' }}" \
            --tag "ai-order-platform-frontend:${GITHUB_SHA}" \
            .

      - name: Package the release
        id: package
        shell: bash
        run: |
          set -euo pipefail
          package_dir="${RUNNER_TEMP}/ai-order-${GITHUB_SHA}"
          install -d -m 700 "${package_dir}"

          git archive \
            --format=tar.gz \
            --output="${package_dir}/source-${GITHUB_SHA}.tar.gz" \
            "${GITHUB_SHA}"

          docker save \
            "ai-order-platform-backend:${GITHUB_SHA}" \
            "ai-order-platform-frontend:${GITHUB_SHA}" \
            | gzip -1 >"${package_dir}/images-${GITHUB_SHA}.tar.gz"

          (
            cd "${package_dir}"
            sha256sum \
              "source-${GITHUB_SHA}.tar.gz" \
              "images-${GITHUB_SHA}.tar.gz" \
              >"checksums-${GITHUB_SHA}.sha256"
          )

          printf 'package_dir=%s\n' "${package_dir}" >>"${GITHUB_OUTPUT}"

      - name: Configure production SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?missing PRODUCTION_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?missing PRODUCTION_SSH_KNOWN_HOSTS}"
          : "${SSH_HOST:?missing PRODUCTION_SSH_HOST}"
          : "${SSH_USER:?missing PRODUCTION_SSH_USER}"

          install -d -m 700 "${HOME}/.ssh"
          install -m 600 /dev/null "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${SSH_PRIVATE_KEY}" >"${HOME}/.ssh/id_ed25519"
          install -m 600 /dev/null "${HOME}/.ssh/known_hosts"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" >"${HOME}/.ssh/known_hosts"

      - name: Upload verified release bundle
        shell: bash
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PACKAGE_DIR: ${{ steps.package.outputs.package_dir }}
        run: |
          set -euo pipefail
          remote_stage=".cache/ai-order-deploy/${GITHUB_SHA}"
          ssh \
            -i "${HOME}/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "install -d -m 700 \"\$HOME/${remote_stage}\""

          scp \
            -i "${HOME}/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${PACKAGE_DIR}/source-${GITHUB_SHA}.tar.gz" \
            "${PACKAGE_DIR}/images-${GITHUB_SHA}.tar.gz" \
            "${PACKAGE_DIR}/checksums-${GITHUB_SHA}.sha256" \
            scripts/deploy-production-release.sh \
            "${SSH_USER}@${SSH_HOST}:${remote_stage}/"

      - name: Deploy and verify production
        shell: bash
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          remote_stage=".cache/ai-order-deploy/${GITHUB_SHA}"
          ssh \
            -i "${HOME}/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "bash '${remote_stage}/deploy-production-release.sh' \
              '${GITHUB_SHA}' \
              '${remote_stage}/source-${GITHUB_SHA}.tar.gz' \
              '${remote_stage}/images-${GITHUB_SHA}.tar.gz' \
              '${remote_stage}/checksums-${GITHUB_SHA}.sha256'"

      - name: Verify public login origins and canonical redirects
        shell: bash
        run: |
          set -euo pipefail
          canonical_origin='https://chinesedigitaldental.com'
          alias_origin='https://www.chinesedigitaldental.com'
          direct_origin='http://43.129.232.106:8088'
          header_file="$(mktemp)"
          body_file="$(mktemp)"
          trap 'rm -f "${header_file}" "${body_file}"' EXIT

          probe_login_cors() {
            local allowed_origin="$1"
            local status_code=''
            for _attempt in $(seq 1 12); do
              : >"${header_file}"
              : >"${body_file}"
              status_code="$(curl \
                --silent --show-error --max-time 10 \
                --dump-header "${header_file}" \
                --output "${body_file}" \
                --write-out '%{http_code}' \
                --request POST "${canonical_origin}/api/auth/login" \
                --header "Origin: ${allowed_origin}" \
                --header 'Content-Type: application/json' \
                --data '{"username":"nonexistent-cors-check","password":"invalid","portal":"DOCTOR"}' \
                || true)"
              if [[ "${status_code}" == '401' ]] \
                && grep -Fqi "Access-Control-Allow-Origin: ${allowed_origin}" "${header_file}"; then
                printf 'public login CORS probe passed for %s\n' "${allowed_origin}"
                return 0
              fi
              sleep 5
            done
            printf 'public login CORS probe failed for %s (last status %s)\n' \
              "${allowed_origin}" "${status_code}" >&2
            return 1
          }

          probe_redirect() {
            local source_url="$1"
            local expected_location="$2"
            local status_code=''
            for _attempt in $(seq 1 12); do
              : >"${header_file}"
              : >"${body_file}"
              status_code="$(curl \
                --silent --show-error --max-time 10 \
                --dump-header "${header_file}" \
                --output "${body_file}" \
                --write-out '%{http_code}' \
                "${source_url}" \
                || true)"
              if [[ "${status_code}" == '308' ]] \
                && grep -Fqi "Location: ${expected_location}" "${header_file}"; then
                printf 'canonical redirect probe passed for %s\n' "${source_url}"
                return 0
              fi
              sleep 5
            done
            printf 'canonical redirect probe failed for %s (last status %s)\n' \
              "${source_url}" "${status_code}" >&2
            return 1
          }

          probe_login_cors "${canonical_origin}"
          probe_login_cors "${alias_origin}"
          probe_redirect "${alias_origin}/" "${canonical_origin}/"
          probe_redirect "${direct_origin}/" "${canonical_origin}/"
